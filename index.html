<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video 360 Độ Con </title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        /* Giao diện nút bấm điều khiển layer trên cùng */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: rgba(50, 50, 50, 0.9);
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="playBtn">PLAY</button>
        <button id="pauseBtn">PAUSE</button>
    </div>

    <a-scene>
        <a-assets>
            <video id="video360" 
                   src="YTSave_YouTube_Elephants-on-the-Brink-Racing-Extinction_Media_G5Y_X9VeNrw_003_480s" 
                   preload="auto" 
                   crossorigin="anonymous" 
                   loop="true" 
                   webkit-playsinline 
                   playsinline>
            </video>
        </a-assets>

        <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-camera>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>
    </a-scene>

    <script>
        // Xử lý sự kiện bấm nút điều khiển Video
        const video = document.querySelector('#video360');
        const playBtn = document.querySelector('#playBtn');
        const pauseBtn = document.querySelector('#pauseBtn');

        playBtn.addEventListener('click', () => {
            video.play();
        });

        pauseBtn.addEventListener('click', () => {
            video.pause();
        });

        // Tự động yêu cầu quyền truy cập cảm biến (đặc biệt quan trọng đối với iOS từ 13 trở lên)
        window.addEventListener('click', function () {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            console.log("Cảm biến đã được cấp quyền!");
                        }
                    })
                    .catch(console.error);
            }
        }, { once: true }); // Chỉ chạy một lần đầu tiên khi người dùng chạm vào màn hình
    </script>
</body>
</html>
