<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 VR Video</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:black;
    }

    #playBtn{
      position:absolute;
      z-index:999;
      top:20px;
      left:20px;
      padding:10px 15px;
      border:none;
      border-radius:10px;
      background:#2196f3;
      color:white;
      font-size:16px;
    }
  </style>
</head>

<body>

<button id="playBtn">
  Play VR Video
</button>

<a-scene>

  <a-assets>

    <!-- VIDEO CỦA BẠN -->
    <video
      id="video360"
      loop
      crossorigin="anonymous"
      webkit-playsinline
      playsinline
    >
      <source
        src="downloadvideoVN_sheikra-8k-360-pov-front-back-row-the-ultimate-dive-vr-roller-coaster-experience_FHD.mp4"
        type="video/mp4"
      >
    </video>

  </a-assets>

  <!-- VIDEO 360 -->
  <a-videosphere src="#video360"></a-videosphere>

  <!-- CAMERA -->
  <a-camera></a-camera>

</a-scene>

<script>
  const btn = document.getElementById("playBtn");
  const video = document.getElementById("video360");

  btn.onclick = async () => {

    // iPhone
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

      try {

        const permission =
          await DeviceOrientationEvent.requestPermission();

        if(permission === "granted"){
          video.play();
        }

      } catch(e){
        alert(e);
      }

    } else {

      // Android
      video.play();

    }

  };
</script>

</body>
</html>
